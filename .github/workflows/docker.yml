name: Build and Push Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs when a new push arrives - only latest commit builds
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # ghcr.io intermittently answers a valid GITHUB_TOKEN with `denied: denied`
      # (seen 2026-08-07, passed on retry with identical config). docker/login-action
      # has no retry, so do the login by hand with a short backoff.
      - name: Log in to Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            if echo "$GHCR_TOKEN" | docker login "$REGISTRY" -u "$GITHUB_ACTOR" --password-stdin; then
              exit 0
            fi
            echo "login attempt $attempt failed, retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          echo "::error::could not log in to $REGISTRY after 3 attempts"
          exit 1

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # BuildKit secret, not a build-arg - build-args are written to the image
          # config history and this image is publicly pullable.
          secrets: |
            github_token=${{ secrets.TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

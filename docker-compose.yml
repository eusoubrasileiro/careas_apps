services:
  careas-app:
    build:
      context: .
      secrets:
        - github_token
    image: ghcr.io/eusoubrasileiro/careas_apps:latest
    container_name: careas-app
    restart: unless-stopped
    environment:
      - APP_ENV=production
    networks:
      - network_public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.careas.rule=Host(`gis.anm.amiticia.cc`)"
      - "traefik.http.routers.careas.entrypoints=websecure"
      - "traefik.http.routers.careas.tls.certresolver=myresolver"
      - "traefik.http.services.careas.loadbalancer.server.port=8000"

networks:
  network_public:
    external: true

# Build-time only: read from the GITHUB_TOKEN env var (or .env) and mounted into the
# aidbag install step. Never lands in an image layer.
secrets:
  github_token:
    environment: GITHUB_TOKEN
